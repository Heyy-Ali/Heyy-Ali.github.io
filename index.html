<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ali Heydari</title>
  <meta name="description" content="Ali Heydari: mechanical and biomedical engineer working across CFD, microfluidics, fabrication and experiments. PhD candidate at Penn State.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#top" class="logo" id="logo" aria-label="Back to top"></a>
    <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- All visible text comes from content.js (the "labels" section). -->
  <nav class="menu" id="menu" aria-label="Main" hidden></nav>

  <main id="top">
    <section class="hero">
      <canvas id="flow" aria-hidden="true"></canvas>
      <div class="hero-inner">
        <p class="kicker" id="kicker"></p>
        <h1 id="name"></h1>
        <p class="tagline" id="tagline"></p>
        <div class="hero-actions" id="heroButtons"></div>
      </div>
    </section>

    <section class="section narrow" id="about">
      <h2 id="aboutTitle"></h2>
      <div id="aboutText"></div>
    </section>

    <section class="section" id="work">
      <div class="narrow-wide">
        <div class="section-head">
          <h2 id="workTitle"></h2>
          <p class="legend"></p>
        </div>
        <div id="projects" class="projects"></div>
      </div>
    </section>

    <section class="section narrow" id="papers">
      <h2 id="papersTitle"></h2>
      <div id="paperList"></div>
      <p class="more" id="scholarMore"></p>
    </section>

    <section class="section" id="journey">
      <div class="narrow">
        <h2 id="journeyTitle"></h2>
        <p class="sub" id="journeySubtitle"></p>
        <p class="legend"></p>
      </div>
      <div id="timeline" class="timeline"></div>
    </section>
  </main>

  <footer class="footer" id="contact">
    <div class="socials" id="socials"></div>
    <a class="pill pill-lime" id="contactBtn" href="#"></a>
    <p class="small">© <span id="year"></span> <span id="footName"></span></p>
  </footer>

  <script src="content.js"></script>
  <script src="main.js"></script>
</body>
</html>
